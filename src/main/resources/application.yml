spring:
  application:
    name: reserva-salas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reserva_salas}
    username: ${DB_USER:reserva}
    password: ${DB_PASSWORD:reserva}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    # Sem valor padrão: a aplicação não sobe sem JWT_SECRET.
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT15M}
  refresh:
    ttl: ${REFRESH_TTL:P7D}
  ratelimit:
    login-per-minute: 10
    write-per-minute: 60
  notifications:
    # log: só registra no console. smtp: envia por SMTP (spring.mail.*).
    mode: ${NOTIFICATION_MODE:log}
    from: ${NOTIFICATION_FROM:noreply@reserva.local}
  reservation:
    max-duration: PT4H
    cancel-deadline: PT2H
    max-active-per-user: 3
    slot: PT15M

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
