name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Segredo só de CI. Nunca reutilize em produção.
      JWT_SECRET: ci-only-secret-com-mais-de-32-bytes-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, testes e cobertura (gate JaCoCo 80%)
        run: ./mvnw -B verify

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Build da imagem Docker
        run: docker build -t reserva-salas:${{ github.sha }} .
