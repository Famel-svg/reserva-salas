# Sobe app e banco com um comando: docker compose up --build
# Antes, copie .env.example para .env e defina JWT_SECRET.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reserva_salas
      POSTGRES_USER: reserva
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reserva}
    # Sem "ports": o banco fica só na rede interna do compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserva -d reserva_salas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Falha no startup se JWT_SECRET não estiver definido.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      DB_URL: jdbc:postgresql://db:5432/reserva_salas
      DB_USER: reserva
      DB_PASSWORD: ${DB_PASSWORD:-reserva}
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-log}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "3000:80"

# Dados do Postgres sobrevivem a "docker compose down". Use "down -v" para apagar.
volumes:
  pgdata:
